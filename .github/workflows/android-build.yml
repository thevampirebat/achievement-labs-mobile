name: Android standalone beta
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LABS_CATALOGUE: ${{ github.workspace }}/mobile/Catalogue
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare the shared deterministic mobile catalogue and Android icon
        run: |
          python3 mobile/tools/test_edition_catalogue.py
          python3 mobile/tools/prepare_catalogue.py
          cp -R mobile/Catalogue android/app/src/main/assets/catalogue
          mkdir -p android/app/src/main/res/drawable
          cp assets/achievement-labs-icon.png android/app/src/main/res/drawable/app_icon.png
      - name: Check JavaScript and build the signed test APK
        run: |
          node --check android/app/src/main/assets/app.js
          node android/ui-checks.cjs
          gradle -p android -PlabsSideBySidePreview=true testDebugUnitTest assembleDebug lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AchievementLabs-Android-Green-Badges-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
